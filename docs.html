<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docs — Beat Planner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="src/style-docs.css" />
  <!-- Applied before first paint, or the wrong theme flashes -->
  <script>
    try {
      var t = localStorage.getItem('bp-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>

  <header class="dv-topbar">
    <a class="dv-back" href="index.html" aria-label="Back to home"><i class="ti ti-arrow-left"></i></a>
    <h1 class="dv-brand">Beat Planner <span>Docs</span></h1>
    <div class="dv-search">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="search" id="dv-filter" placeholder="Filter documents" aria-label="Filter documents" />
    </div>
    <span class="dv-count" id="dv-count"></span>
    <button class="dv-theme" type="button" id="theme-toggle"></button>
  </header>

  <div class="dv-body">

    <!-- The folder's contents, read at load time -->
    <nav class="dv-list" id="dv-list" aria-label="Documents"></nav>

    <main class="dv-main">
      <div class="dv-doc-head" id="dv-doc-head" hidden>
        <div>
          <h2 id="dv-doc-title"></h2>
          <p class="dv-doc-meta" id="dv-doc-meta"></p>
        </div>
        <a class="dv-raw" id="dv-raw" href="#" download>
          <i class="ti ti-download" aria-hidden="true"></i>Download Raw
        </a>
      </div>
      <article class="dv-doc markdown" id="dv-doc"></article>
    </main>

    <!-- Built from the document's own H2s -->
    <aside class="dv-toc" id="dv-toc" aria-label="On this page"></aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="src/theme.js"></script>
  <script src="src/docs-viewer.js"></script>
</body>
</html>
