<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beat Planner — Navigation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <!-- Applied before first paint, or the wrong theme flashes -->
  <script>
    try {
      var t = localStorage.getItem('bp-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg:        #eef1f9;
      --card:      #ffffff;
      --heading:   #202123;
      --base:      #313949;
      --label:     #616e88;
      --border:    #d5d8e9;
      --accent:    #5767f6;
      --arrow:     #8b9bb8;
      --shadow:    rgba(0, 0, 0, 0.06);
      --shadow-up: rgba(0, 0, 0, 0.12);
      color-scheme: light;
    }

    /* Dark. Declared once and reached two ways: by the system preference
       while no explicit choice is stored, and by the choice itself. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:        #12141c;
        --card:      #1a1d27;
        --heading:   #eceef5;
        --base:      #d3d7e3;
        --label:     #8b93a7;
        --border:    #2c3140;
        --accent:    #8f9bff;
        --arrow:     #6b7285;
        --shadow:    rgba(0, 0, 0, 0.35);
        --shadow-up: rgba(0, 0, 0, 0.5);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg:        #12141c;
      --card:      #1a1d27;
      --heading:   #eceef5;
      --base:      #d3d7e3;
      --label:     #8b93a7;
      --border:    #2c3140;
      --accent:    #8f9bff;
      --arrow:     #6b7285;
      --shadow:    rgba(0, 0, 0, 0.35);
      --shadow-up: rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Zoho Puvi', 'Puvi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      background: var(--bg);
      color: var(--heading);
    }

    .home-title {
      font-size: 26px;
      font-weight: 600;
      color: var(--heading);
    }

    .home-subtitle {
      margin-top: -28px;
      font-size: 14px;
      color: var(--label);
    }

    .nav-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 320px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: var(--base);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 8px var(--shadow);
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px var(--shadow-up);
      border-color: var(--accent);
    }

    .nav-btn i {
      font-size: 22px;
      color: var(--accent);
    }

    .nav-btn .nav-arrow {
      margin-left: auto;
      font-size: 18px;
      color: var(--arrow);
    }

    /* Sits out of the way in the corner — this page is a launcher, and
       the theme is not one of the things being launched */
    .home-theme {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--label);
      font-size: 17px;
      cursor: pointer;
    }

    .home-theme:hover { color: var(--base); border-color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .nav-btn { transition: none; }
      .nav-btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <button class="home-theme" type="button" id="theme-toggle"></button>

  <div>
    <h1 class="home-title">Beat Planner</h1>
  </div>

  <nav class="nav-buttons">
    <a class="nav-btn" href="planner-config.html">
      <i class="ti ti-settings" aria-hidden="true"></i>
      Planner Config
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="visit-types.html">
      <i class="ti ti-list-check" aria-hidden="true"></i>
      Visit Type
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="docs.html">
      <i class="ti ti-book" aria-hidden="true"></i>
      Docs
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="beat-detail.html">
      <i class="ti ti-calendar-check" aria-hidden="true"></i>
      Beat Detail View
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="pending-assignments.html">
      <i class="ti ti-alert-triangle" aria-hidden="true"></i>
      Pending Assignments
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="non-map.html">
      <i class="ti ti-map" aria-hidden="true"></i>
      Field View
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="create-beat.html">
      <i class="ti ti-route" aria-hidden="true"></i>
      Create Beat
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="distribute-beat.html">
      <i class="ti ti-arrows-split-2" aria-hidden="true"></i>
      Distribute Beat
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
  </nav>

  <script src="src/theme.js"></script>
</body>
</html>
