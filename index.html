<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beat Planner — Navigation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Zoho Puvi', 'Puvi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      background: #eef1f9;
      color: #202123;
    }

    .home-title {
      font-size: 26px;
      font-weight: 600;
      color: #202123;
    }

    .home-subtitle {
      margin-top: -28px;
      font-size: 14px;
      color: #616e88;
    }

    .nav-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 320px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      background: #fff;
      border: 1px solid #d5d8e9;
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: #313949;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      border-color: #5767f6;
    }

    .nav-btn i {
      font-size: 22px;
      color: #5767f6;
    }

    .nav-btn .nav-arrow {
      margin-left: auto;
      font-size: 18px;
      color: #8b9bb8;
    }
  </style>
</head>
<body>
  <div>
    <h1 class="home-title">Beat Planner</h1>
  </div>

  <nav class="nav-buttons">
    <a class="nav-btn" href="planner-config.html">
      <i class="ti ti-settings" aria-hidden="true"></i>
      Planner Config
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="visit-types.html">
      <i class="ti ti-list-check" aria-hidden="true"></i>
      Visit Type
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="docs.html">
      <i class="ti ti-book" aria-hidden="true"></i>
      Docs
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="beat-detail.html">
      <i class="ti ti-calendar-check" aria-hidden="true"></i>
      Beat Detail View
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="pending-assignments.html">
      <i class="ti ti-alert-triangle" aria-hidden="true"></i>
      Pending Assignments
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="non-map.html">
      <i class="ti ti-map" aria-hidden="true"></i>
      Field View
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="create-beat.html">
      <i class="ti ti-route" aria-hidden="true"></i>
      Create Beat
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
    <a class="nav-btn" href="bottom-up.html">
      <i class="ti ti-arrow-up" aria-hidden="true"></i>
      Bottom-Up Approach
      <i class="ti ti-chevron-right nav-arrow" aria-hidden="true"></i>
    </a>
  </nav>
</body>
</html>
