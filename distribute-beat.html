<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distribute Beat — Beat Planner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="src/style-create-beat.css" />
  <link rel="stylesheet" href="src/map-controls.css" />
  <link rel="stylesheet" href="src/style-distribute-beat.css" />
</head>
<body>
  <div class="cb-app">

    <!-- Header -->
    <header class="cb-header">
      <div class="cb-title">Distribute Beat Plans</div>
      <div class="cb-actions">
        <button class="cb-btn cancel" id="cb-cancel">Cancel</button>
        <!-- Enabled once the beat has a name, a duration and a record -->
        <button class="cb-btn save db-continue" id="db-continue" disabled>Continue</button>
      </div>
    </header>

    <!-- Body -->
    <div class="cb-body">

      <!-- Left panel: Beat Details (Figma 1384:56699 empty, 1406:37302 with records) -->
      <aside class="cb-panel db-panel">
        <h2 class="cb-panel-title">Beat Details</h2>

        <div class="cb-field-row db-name-row">
          <label class="cb-field-label" for="db-name">Distribution Name</label>
          <div class="cb-field-control">
            <label class="db-input">
              <img class="cb-strip" src="src/distribute/mandatory-strip.svg" alt="" aria-hidden="true" />
              <input id="db-name" type="text" autocomplete="off" required />
            </label>
          </div>
        </div>

        <div class="cb-field-row">
          <label class="cb-field-label" for="db-start">Beat Duration</label>
          <div class="cb-field-control">
            <div class="db-duration">
              <label class="db-input">
                <img class="cb-strip" src="src/distribute/mandatory-strip.svg" alt="" aria-hidden="true" />
                <input id="db-start" class="db-date" type="text" placeholder="DD/MM/YYYY"
                       inputmode="numeric" maxlength="10" autocomplete="off" required />
              </label>
              <label class="db-input">
                <img class="cb-strip" src="src/cb-filter/field-strip.svg" alt="" aria-hidden="true" />
                <input id="db-end" class="db-date" type="text" placeholder="DD/MM/YYYY"
                       inputmode="numeric" maxlength="10" autocomplete="off" aria-label="End date" />
              </label>
            </div>
          </div>
        </div>

        <!-- The records picked on the map, each with its visit type -->
        <section class="db-selected" id="db-selected" hidden>
          <div class="db-sel-head">
            <p class="db-sel-count">
              <span id="db-count"></span>
              <button class="db-link" type="button" id="db-clear">Clear</button>
            </p>
            <div class="cb-module-wrap db-apply" id="db-apply-wrap">
              <button class="db-ghost" type="button" id="db-apply"
                      aria-haspopup="listbox" aria-expanded="false">
                <span>Apply to all</span>
                <img src="src/distribute/caret-link.svg" alt="" aria-hidden="true" />
              </button>
              <!-- menu: CbMenu, the visit types -->
            </div>
          </div>
          <ul class="db-list" id="db-list"></ul>
        </section>
      </aside>

      <!-- Map -->
      <div class="cb-map-wrapper">

        <!-- Map toolbar -->
        <div class="cb-map-toolbar">
          <div class="cb-toolbar-left">
            <div class="cb-module-wrap" id="cb-module-wrap">
              <div class="cb-module-select" id="cb-module-select" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-controls="cb-module-list">
                <img class="cb-strip" src="src/cb-filter/field-strip.svg" alt="" aria-hidden="true" />
                <span class="cb-fill" id="cb-module-label">All Modules</span>
                <span class="cb-module-caret"><img src="src/cb-filter/caret.svg" alt="" aria-hidden="true" /></span>
              </div>
              <!-- menu: CbMenu, no title -->
            </div>
            <!-- Filter: one control with two hit areas. The body opens the
                 panel; the ✕ appears only once a filter is applied and lifts
                 it. Built from Figma 5763:222731. -->
            <div class="cbf" id="cbf" data-module="all">
              <div class="cbf-btn" id="cbf-btn">
                <button class="cbf-open" type="button" id="cbf-open"
                        aria-haspopup="dialog" aria-expanded="false" aria-controls="cbf-pop">
                  <span class="cbf-icon">
                    <img src="src/cb-filter/filter.svg" alt="" aria-hidden="true" />
                    <img class="cbf-dot" src="src/cb-filter/filter-dot.svg" alt="" aria-hidden="true" />
                  </span>
                  <span class="cbf-label">Filter</span>
                </button>
                <button class="cbf-clear" type="button" id="cbf-clear" aria-label="Clear filter">
                  <span class="cbf-clear-x">
                    <img class="cbf-x-rest"  src="src/cb-filter/tag-close.svg" alt="" aria-hidden="true" />
                    <img class="cbf-x-hover" src="src/cb-filter/tag-close-hover.svg" alt="" aria-hidden="true" />
                  </span>
                  <!-- Inside the button, so the tooltip clears the filter too -->
                  <span class="cbf-tip" id="cbf-tip" aria-hidden="true"></span>
                </button>
              </div>

              <div class="cbf-pop" id="cbf-pop" role="dialog" aria-labelledby="cbf-pop-title" hidden>
                <div class="cbf-pop-head">
                  <p class="cbf-pop-title" id="cbf-pop-title">Filter by</p>
                  <button class="cbf-pop-close" type="button" id="cbf-pop-close" aria-label="Close filter">
                    <span class="cbf-pop-x"><img src="src/cb-filter/close-small.svg" alt="" aria-hidden="true" /></span>
                  </button>
                </div>
                <div class="cbf-rows" id="cbf-rows"></div>
                <div class="cbf-cta" id="cbf-cta" hidden>
                  <button class="cb-btn cbf-btn-default" type="button" id="cbf-clear-all">Clear All</button>
                  <button class="cb-btn cbf-btn-primary" type="button" id="cbf-apply">Apply Filter</button>
                </div>
              </div>
            </div>
          </div>
          <div class="cb-toolbar-right">
            <div class="cb-pagination">
              <!-- The arrows swap to the Figma "Disable" variant at either end.
                   Figma has no disabled Next, so it is the disabled Back, mirrored. -->
              <button class="cb-page-arrow" id="cb-prev" aria-label="Previous page" disabled>
                <img src="src/cb-filter/arrow-back-disabled.svg" alt="" aria-hidden="true" />
              </button>
              <span class="cb-page-info"><b id="cb-page-from">1</b> <span>to</span> <b id="cb-page-to">50</b></span>
              <button class="cb-page-arrow" id="cb-next" aria-label="Next page">
                <img src="src/cb-filter/arrow-next.svg" alt="" aria-hidden="true" />
              </button>
            </div>
            <!-- Records per Page, behind this frame's icon/ configure settings -->
            <div class="cb-module-wrap cb-perpage" id="cb-perpage">
              <button class="cb-settings-btn" id="cb-settings" type="button"
                      aria-haspopup="listbox" aria-expanded="false" aria-controls="cb-perpage-list"
                      aria-label="Records per Page: 50" title="Records per Page: 50">
                <img class="db-settings-icon" src="src/distribute/configure-settings.svg" alt="" aria-hidden="true" />
              </button>
              <!-- menu: CbMenu, titled "Records per Page" -->
            </div>
          </div>
        </div>

        <!-- Map canvas -->
        <div class="map-area" id="map-area">
          <canvas id="map-canvas" aria-label="Beat map"></canvas>

          <!-- Layers thumbnail -->
          <button class="cb-layers" id="cb-layers" aria-label="Toggle layers">
            <span class="cb-layers-label"><i class="ti ti-stack-2" aria-hidden="true"></i>Layers</span>
          </button>

          <!-- Floating controls -->
          <div class="cb-map-controls">
            <button class="cb-ctrl-btn" id="cb-lasso" aria-label="Lasso select">
              <i class="ti ti-lasso" aria-hidden="true"></i>
            </button>
            <button class="cb-ctrl-btn" id="cb-locate" aria-label="Locate">
              <i class="ti ti-current-location" aria-hidden="true"></i>
            </button>
            <div class="cb-zoom">
              <button id="zoom-in" aria-label="Zoom in">+</button>
              <button id="zoom-out" aria-label="Zoom out">−</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="src/data.js"></script>
  <script src="src/map.js"></script>
  <script src="src/create-beat-records.js"></script>
  <script src="src/cb-menu.js"></script>
  <script src="src/cb-toolbar.js"></script>
  <script src="src/distribute-beat.js"></script>
  <script src="src/create-beat-filter.js"></script>
</body>
</html>
